# Builds nuzzle for the Asciiverse catalog: one archive per target,
# nuzzle-<target>.tar.gz, plus SHA256SUMS, attached to a GitHub release
# (hub/catalog/SCHEMA.md, release.source = "github"). Runs on a pushed tag
# of ours (<version>+<snapshot date>-av.<n>, e.g. 0.3.2+20230714-av.2;
# upstream's own v0.3.2 style tags do not match), or by hand for an
# existing tag.
#
# Linux builds run in Alpine and link ncursesw and menuw statically, so the
# binaries carry the -musl triple av looks for first and need no libncurses
# on the player's machine. macOS does the same with ncurses built from
# source for each architecture: the system's libmenu exports no symbols
# (its SDK stub lists none, so new_menu and the rest do not link), and its
# ncurses is 5.7. That ncurses reads the system's terminfo in
# /usr/share/terminfo. No Windows build: PDCurses has no menu library.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NCURSES_VERSION: "6.5"
  NCURSES_SHA256: 136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build, test and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static &&
            LIBS="-lmenuw -lncursesw" LDFLAGS="-static -s" asciiverse/build.sh &&
            (cd /tmp && /src/out/ut_test > /dev/null) &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/nuzzle

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: ncurses, static, with its menu library
        run: |
          curl -sfLO "https://ftp.gnu.org/gnu/ncurses/ncurses-$NCURSES_VERSION.tar.gz"
          echo "$NCURSES_SHA256  ncurses-$NCURSES_VERSION.tar.gz" | shasum -a 256 -c
          tar -xzf "ncurses-$NCURSES_VERSION.tar.gz" -C "$RUNNER_TEMP"
          rm "ncurses-$NCURSES_VERSION.tar.gz"
          cd "$RUNNER_TEMP/ncurses-$NCURSES_VERSION"
          # the arm64 runner cross-builds x86_64; build tools stay native
          ./configure --build=aarch64-apple-darwin --host=${{ matrix.target }} --with-build-cc=cc \
            CC="cc -arch ${{ matrix.arch }}" CFLAGS=-O2 \
            --prefix="$RUNNER_TEMP/ncurses" --enable-widec --enable-overwrite \
            --without-shared --without-debug --without-cxx --without-cxx-binding \
            --without-ada --without-progs --without-tests --without-manpages \
            --disable-db-install --disable-mixed-case \
            --with-default-terminfo-dir=/usr/share/terminfo \
            --with-terminfo-dirs=/usr/share/terminfo
          make -j3
          make install
          ls "$RUNNER_TEMP/ncurses/lib"

      - name: Build and package
        run: |
          nc="$RUNNER_TEMP/ncurses"
          CFLAGS="-O2 -arch ${{ matrix.arch }} -D_XOPEN_SOURCE_EXTENDED -D_DARWIN_C_SOURCE -I$nc/include -I$nc/include/ncursesw" LDFLAGS="-arch ${{ matrix.arch }}" LIBS="$nc/lib/libmenuw.a $nc/lib/libncursesw.a" asciiverse/build.sh
          strip out/nuzzle
          file out/nuzzle
          if [ ${{ matrix.arch }} = arm64 ]; then (cd /tmp && "$GITHUB_WORKSPACE/out/ut_test" > /dev/null); fi
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "nuzzle $TAG" \
                 --notes "nuzzle ${TAG%%-av.*} from github.com/dead-end/nuzzle, Dead End's block-placing puzzles, built for the Asciiverse catalog. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
