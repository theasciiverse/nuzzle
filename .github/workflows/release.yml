# Builds nuzzle for the Asciiverse catalog: one archive per target,
# nuzzle-<target>.tar.gz, plus SHA256SUMS, attached to a GitHub release
# (hub/catalog/SCHEMA.md, release.source = "github"). Runs on a pushed tag
# of ours (v<version>-av.<n>; upstream's own v0.3.2 style tags do not
# match), or by hand for an existing tag.
#
# Linux builds run in Alpine and link ncursesw and menuw statically, so the
# binaries carry the -musl triple av looks for first and need no libncurses
# on the player's machine. macOS links the system ncurses and menu, whose
# wide-character functions need _XOPEN_SOURCE_EXTENDED. No Windows build:
# PDCurses has no menu library.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build, test and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static &&
            LIBS="-lmenuw -lncursesw" LDFLAGS="-static -s" asciiverse/build.sh &&
            (cd /tmp && /src/out/ut_test > /dev/null) &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/nuzzle

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          CFLAGS="-O2 -arch ${{ matrix.arch }} -D_XOPEN_SOURCE_EXTENDED -D_DARWIN_C_SOURCE" LDFLAGS="-arch ${{ matrix.arch }}" LIBS="-lmenu -lncurses" asciiverse/build.sh
          strip out/nuzzle
          file out/nuzzle
          if [ ${{ matrix.arch }} = arm64 ]; then (cd /tmp && "$GITHUB_WORKSPACE/out/ut_test" > /dev/null); fi
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "nuzzle $TAG" \
                 --notes "nuzzle ${TAG%%-av.*} from github.com/dead-end/nuzzle, Dead End's block-placing puzzles, built for the Asciiverse catalog. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
